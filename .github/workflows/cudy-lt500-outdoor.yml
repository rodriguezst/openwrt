name: Build Cudy LT500 Outdoor images

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build firmware images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config for Cudy LT500 Outdoor
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_ramips=y' \
            'CONFIG_TARGET_ramips_mt76x8=y' \
            'CONFIG_TARGET_ramips_mt76x8_DEVICE_cudy_lt500-outdoor-v1=y' \
            'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' \
            'CONFIG_TARGET_ROOTFS_INITRAMFS=y' \
            'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
            'CONFIG_PACKAGE_luci=y' \
            'CONFIG_PACKAGE_modemmanager=y' \
            'CONFIG_PACKAGE_luci-proto-modemmanager=y' \
            > .config
          make defconfig

      - name: Enable Wi-Fi on default config
        run: |
          mkdir -p files/etc/uci-defaults
          printf '%s\n' \
            "uci set wireless.radio0.disabled='0'" \
            "uci commit" \
            > files/etc/uci-defaults/99-enable-wireless

      - name: Download package sources
        run: make download -j$(nproc) V=s

      - name: Build tools
        run: |
          make tools/install -j$(nproc) V=s || \
          make tools/install V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) V=s || \
          make toolchain/install V=s

      - name: Build target images
        run: |
          make -j$(nproc) world V=s || \
          make world V=s

      - name: Pack build output
        run: tar -cvf cudy-lt500-outdoor-images.tar bin/targets/ramips/mt76x8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cudy-lt500-outdoor-images
          path: cudy-lt500-outdoor-images.tar

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: cudy-lt500-outdoor-images

      - name: Extract image artifacts
        run: tar xf cudy-lt500-outdoor-images.tar

      - name: Prepare release metadata
        run: |
          echo "RELEASE_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=Cudy LT500 Outdoor - $(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=cudy-lt500-outdoor-25.12-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Create release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          title: ${{ env.RELEASE_TITLE }}
          automatic_release_tag: ${{ env.RELEASE_TAG }}
          files: |
            bin/targets/ramips/mt76x8/openwrt-ramips-mt76x8-cudy_lt500-outdoor-v1-*
            bin/targets/ramips/mt76x8/sha256sums
            bin/targets/ramips/mt76x8/profiles.json
            bin/targets/ramips/mt76x8/*.buildinfo
            bin/targets/ramips/mt76x8/*.manifest
